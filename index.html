  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delta Green AI-Powered Agent Creator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #1a202c; /* A dark slate color similar to tailwind's gray-900 */
      }
      @keyframes pulse-glow {
        0%, 100% {
          transform: scale(1);
          box-shadow: none;
        }
        5% {
          transform: scale(1.05);
          box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
        }
        10% {
          transform: scale(1);
          box-shadow: none;
        }
      }
      .animate-pulse-glow {
        animation: pulse-glow 12s infinite ease-in-out;
      }
      @keyframes critical-glow {
        0%, 100% {
            color: #E2E8F0; /* gray-200 */
            text-shadow: none;
        }
        50% {
            color: #FBBF24; /* amber-400 */
            text-shadow: 0 0 8px rgba(251, 191, 36, 0.7);
        }
      }
      .animate-critical-glow {
          animation: critical-glow 2.5s infinite ease-in-out;
      }
      @keyframes glow-indicator {
        0%, 100% {
          box-shadow: 0 0 5px rgba(74, 222, 128, 0), 0 0 10px rgba(74, 222, 128, 0);
        }
        50% {
          box-shadow: 0 0 15px rgba(74, 222, 128, 0.7), 0 0 25px rgba(74, 222, 128, 0.5);
        }
      }
      .animate-glow-indicator {
        animation: glow-indicator 3s infinite ease-in-out;
      }
      select, option {
        background-color: #2D3748; /* gray-800 */
        color: #E2E8F0; /* gray-200 */
      }
      select:focus {
        outline-offset: 2px;
      }
      @keyframes item-fade-in {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-item-fade-in {
        animation: item-fade-in 0.5s ease-out forwards;
      }

      /* Dark-theme scrollbars (Firefox + Chromium/WebKit) */
      * {
        scrollbar-width: thin;
        scrollbar-color: #4a5568 #1a202c; /* gray-600 thumb, gray-900 track */
      }
      *::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      *::-webkit-scrollbar-track {
        background: #1a202c;
        border-radius: 8px;
      }
      *::-webkit-scrollbar-thumb {
        background: #4a5568;
        border-radius: 8px;
        border: 2px solid #1a202c;
      }
      *::-webkit-scrollbar-thumb:hover {
        background: #718096; /* gray-500 */
      }
      *::-webkit-scrollbar-corner {
        background: #1a202c;
      }
    </style>
